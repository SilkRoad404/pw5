<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUTAS — Route Tracker</title>

<meta name="theme-color" content="#0a0e14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scan"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">EA</span>
    <div class="brand-text">
      <span class="brand-title">RUTAS</span>
      <span class="brand-sub">Hecho por Edwin Acosta</span>
    </div>
  </div>
  <button id="btn-history" class="icon-btn" aria-label="Ver historial">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8z"/></svg>
  </button>
</header>

<main>
  <div id="map"></div>

  <section class="hud">
    <div class="hud-stat">
      <svg class="hud-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <div class="hud-stat-text">
        <div class="hud-value-row">
          <span class="hud-value" id="stat-distance">0.00</span>
          <span class="hud-unit">km</span>
        </div>
        <span class="hud-label">distancia</span>
      </div>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-stat">
      <svg class="hud-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 10.41V6h-2v7l5.24 3.15 1-1.65z"/></svg>
      <div class="hud-stat-text">
        <div class="hud-value-row">
          <span class="hud-value" id="stat-time">00:00:00</span>
        </div>
        <span class="hud-label">tiempo</span>
      </div>
    </div>
  </section>

  <span class="map-credit">Edwin Acosta</span>

  <div id="gps-status" class="gps-status">
    <span class="gps-dot"></span>
    <span id="gps-text">esperando señal GPS…</span>
  </div>

  <section class="controls">
    <button id="btn-start" class="ctl-btn ctl-primary">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      <span>Iniciar</span>
    </button>
    <button id="btn-pause" class="ctl-btn" disabled>
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      <span>Pausar</span>
    </button>
    <button id="btn-stop" class="ctl-btn ctl-danger" disabled>
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
      <span>Terminar</span>
    </button>
  </section>
</main>

<!-- Modal: guardar ruta -->
<div id="save-modal" class="modal hidden">
  <div class="modal-card">
    <h2>Guardar ruta</h2>
    <p class="modal-summary" id="modal-summary">0.00 km &middot; 00:00:00</p>
    <input id="route-name" type="text" placeholder="Nombre de la ruta" maxlength="60" autocomplete="off">
    <div class="modal-actions">
      <button id="btn-discard" class="ctl-btn ctl-ghost">Descartar</button>
      <button id="btn-save" class="ctl-btn ctl-primary">Guardar</button>
    </div>
  </div>
</div>

<!-- Panel: historial -->
<div id="history-panel" class="panel hidden">
  <div class="panel-header">
    <h2>Historial</h2>
    <button id="btn-close-history" class="icon-btn" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div id="history-list" class="history-list">
    <p class="history-empty">Todavía no hay rutas guardadas.</p>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
